  <h1>第二章 深海</h1>
  <div id="content">
      <p>　　潜航器下潜到三千二百米时，舷窗外只剩一种颜色。探照灯扫过海底，照亮了那片被称为「数据之海」的区域——铺满整片海床的黑色石板，每一块都刻着密密麻麻的凹槽。</p>
      <p>　　不是文字，至少不是我们认识的文字。但凹槽的间距惊人地均匀，像被某种精密工具切削过。</p>
      <p>　　「它们不是石头，」苏明的声音从耳机里传来，带着轻微的电流杂音，「是刻录。这是某种存储介质。」</p>
      <p>　　我伸手触碰石板的边缘，指尖传来微弱的温度。在这片三千米深的海底，有什么东西还在运转。</p>
  </div>
