  <h1>第四章 暗流</h1>
  <div id="content">
      <p>　　第二个信号来得比预想中快。这一次，石板上的凹槽在夜间发生了位移——整片「数据之海」像呼吸一样微微起伏，把新的刻痕推到海床表面。</p>
      <p>　　新刻痕的内容让所有人沉默：那是一幅地图，坐标指向三十海里外的另一处海沟。地图的绘制精度，远超我们现有的海底测绘数据。</p>
      <p>　　「它在告诉我们去哪儿，」苏明说，「而且，它知道我们听得懂。」</p>
      <p>　　窗外，海面依旧平静。但我知道，在这片海水之下，有什么东西正在等待。像退潮前的暗流，安静，却带着方向。</p>
  </div>
