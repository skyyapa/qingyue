  <h1>第三章 潮汐</h1>
  <div id="content">
      <p>　　解码小组工作了四个月。第四个月的最后一天，程序在石板的凹槽里读出了规律：那不是随机的刻痕，而是以二十七年为周期的潮汐记录。</p>
      <p>　　二十七年前，这里发生过一次小规模的海底地震。石板记录里的峰值，恰好对应着那场地震的每一道余波。</p>
      <p>　　「它在写日记，」负责数据的年轻人说，声音发颤，「而且——它记得比我们更清楚。」</p>
      <p>　　我站在显示器前，看着那串被翻译成数字的潮汐曲线。曲线末尾，有一个比其余所有峰值都大的信号。时间戳是今天。</p>
  </div>
