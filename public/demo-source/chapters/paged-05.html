  <h1>第五章 山隐</h1>
  <div id="content">
    <p>　　没有桥，路就断了。阿青在云海边坐了一整夜，直到天亮时，他看见对岸的山慢慢向后退去，像一头巨大的兽在苏醒前舒展身体。</p>
    <p>　　山隐之后，河出现了。河面平静得能照见云影，而河中央立着一根石柱，柱上只有四个字：旧路在此。</p>
  </div>
