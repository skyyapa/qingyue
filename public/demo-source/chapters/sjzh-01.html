  <h1>第一章 信号</h1>
  <div id="content">
      <p>　　午夜零点，观测站的警报响了第三遍，我才从沙发上爬起来。屏幕上跳动的不是数字，而是一串不断重复的波形——像是有人隔着深海，敲了敲我们的门。</p>
      <p>　　站长苏明站在窗前，盯着远处黑沉沉的海面。「七十年了，」他说，「我们一直在听，这是它第一次开口。」</p>
      <p>　　我凑近屏幕，把波形放大。那节奏很慢，慢到几乎能听出其中的犹豫。我忽然想起小时候学摩尔斯电码的夜晚，想起老师说过的话：任何重复，都是语言的开端。</p>
