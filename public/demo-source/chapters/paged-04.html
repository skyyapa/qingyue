  <h1>第四章 雷动</h1>
  <div id="content">
    <p>　　向东的路走得很顺，三座桥一座比一座古老。第一座桥的木板上刻着「忘」，第二座刻着「念」，第三座什么字也没有。</p>
    <p>　　过完第三座桥，雷声忽然炸响。阿青回头——身后已经没有了桥，只有一片翻涌的云海，像被什么人卷走了来路。</p>
  </div>
