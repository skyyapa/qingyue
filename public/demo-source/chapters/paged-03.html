<body>
  <h1>第三章 雨落</h1>
  <div id="content">
    <p>　　云在正午散尽，雨却落了下来。雨点打在岩壁上，每一滴都带着微光，像是天空在抄写一部没人读过的经文。</p>
    <p>　　阿青伸出手，雨落在掌心，化作一行细小的字：往东走，过三座桥，别回头。</p>
  </div>
