  <h1>终章 岸</h1>
  <div id="content">
      <p>　　第七个月的黎明，石板停止了刻录。整整一周，海床安静得像什么都没有发生过。</p>
      <p>　　我们以为告别了。直到苏明在数据归档时，发现石板的边缘多了一行浅得几乎看不见的凹槽。</p>
      <p>　　那是用我们的文字刻下的三个字，字迹生涩，像刚学会握笔的孩子：</p>
      <p>　　「谢谢听。」</p>
      <p>　　我把这三个字抄进观测日志，合上笔记本。窗外，太阳正从海平线升起，把整片「数据之海」染成金色。</p>
      <p>　　海，还是那片海。但我知道，从此以后，每一次潮汐都多了一层意义——那是跨越七十年的回信，终于抵达了岸。</p>
  </div>
