  <div id="content">
      <p>　　深蓝的水面上浮着一条白线，那白线在缓慢移动，像一头鲸在贴近水面巡游。苏明把望远镜递给我：「它在等我们回答。」</p>
      <p>　　我按下发送键，把刚才那串波形原样回传。三秒钟后，屏幕上的波形变了——不再是重复，而是另一串完整的句子。深海的对话，就这样开始了。</p>
  </div>
