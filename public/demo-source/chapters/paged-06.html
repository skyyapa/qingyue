<body>
  <h1>终章 月明</h1>
  <div id="content">
    <p>　　阿青沿着河走了一夜。月亮升起来的时候，河面亮得像一面镜子，他看见倒影里站着两个人——他自己，和早就去世的师父。</p>
    <p>　　「旧路不是路，」师父的倒影说，「是你终于愿意走的那条。」阿青没有再回头。风停云散，月明如水，他踏上了河中央的石柱，一步，一步，走到了对岸。</p>
  </div>
