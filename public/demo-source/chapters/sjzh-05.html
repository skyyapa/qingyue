  <h1>第五章 浮标</h1>
  <div id="content">
      <p>　　我们按照地图的指引，在目标海沟放下了浮标。三天后，浮标传回了一段声音——不是机械的波形，而是一段近乎人声的吟唱。</p>
      <p>　　语言学组的结论令人不安：那段吟唱的节奏，与我们人类婴儿时期的咿呀学语惊人地相似。</p>
      <p>　　「它在学我们说话，」苏明喃喃道，「就像我们一直在学它的潮汐。」</p>
      <p>　　我望着屏幕上的声纹曲线，忽然意识到一件从未想过的事：也许七十年前，当第一座观测站在这里落成时，海底的「它」也在问同样的问题——来的是谁？想说什么？</p>
  </div>
