  <h1>第一章 风起</h1>
  <div id="content">
    <p>　　山谷里的风是从半夜开始变大的。阿青裹紧外袍，站在瞭望台上数着山下亮起的灯，一盏、两盏，像是有人在大地上撒了一把会发光的种子。</p>
    <p>　　「风起之时，旧路会重新出现。」师父昨夜的话还在耳边。他不确定该不该相信，但灯已经亮了，风也来了。</p>
  </div>
