  <h1>第二章 云涌</h1>
  <div id="content">
    <p>　　天亮时，整片天空都被云层压低了。阿青爬上最高的岩壁，看见云海深处有一座若隐若现的城——那不在他记忆中的任何地图上。</p>
    <p>　　「旧路出现的前提，是云要散。」师父说这话时没有回头。阿青望着那座城，忽然明白了风为什么要从半夜开始吹。</p>
